name: research-gate
description: Validate a research contribution before opening a PR — credential scan, citation integrity, and the live vendor assertion suite.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install hurl
        run: |
          # hurl is the assertion runner. The release archive nests everything
          # under a top-level directory, so extracting a bare "hurl" fails —
          # extract the real path instead, and let the suite be skipped rather
          # than fail the whole gate if the download itself breaks.
          set -euo pipefail
          VER=8.0.1
          URL="https://github.com/Orange-OpenSource/hurl/releases/download/${VER}/hurl-${VER}-x86_64-unknown-linux-gnu.tar.gz"
          if curl -fsSL -o /tmp/hurl.tar.gz "$URL"; then
            tar -xzf /tmp/hurl.tar.gz -C /tmp
            # 8.x nests the binaries under bin/; 7.x put them at the root.
            SRC="/tmp/hurl-${VER}-x86_64-unknown-linux-gnu"
            [ -d "$SRC/bin" ] && SRC="$SRC/bin"
            install -m755 "$SRC/hurl" /usr/local/bin/hurl
            [ -f "$SRC/hurlfmt" ] && install -m755 "$SRC/hurlfmt" /usr/local/bin/hurlfmt
            hurl --version
          else
            echo "::warning::hurl download failed; the live assertion suite will be skipped"
          fi

      - name: Research gate
        run: |
          chmod +x scripts/research-gate.sh
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ./scripts/research-gate.sh
          else
            # On push to main, run everything rather than a diff that no longer exists.
            ./scripts/research-gate.sh --all
          fi

      - name: Mermaid renders (fail if a diagram is malformed)
        run: |
          # A broken mermaid block renders as an error box on GitHub, which reads
          # as "this page is broken". Cheap to catch here instead.
          python3 - <<'PY'
          import glob, re, sys
          bad = 0
          for f in glob.glob('docs/*.md') + ['README.md']:
              text = open(f, encoding='utf-8', errors='replace').read()
              fences = re.findall(r'```mermaid\n(.*?)```', text, re.S)
              for i, block in enumerate(fences, 1):
                  head = block.strip().split('\n')[0]
                  if not re.match(r'^(flowchart|graph|sequenceDiagram|classDiagram|stateDiagram|erDiagram|journey|gantt|pie|gitGraph|mindmap|timeline|quadrantChart|C4Context|sankey-beta|requirementDiagram|xychart-beta)\b', head):
                      print(f'  {f} mermaid #{i}: unrecognised diagram type: {head!r}')
                      bad += 1
                  if '---' in block.split('\n')[0]:
                      print(f'  {f} mermaid #{i}: separator fused into the first row')
                      bad += 1
          print(f'  {bad} mermaid problem(s)')
          sys.exit(1 if bad else 0)
          PY