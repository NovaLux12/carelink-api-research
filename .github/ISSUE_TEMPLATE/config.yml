    url: https://github.com/NovaLux12/carelink-api-research/blob/main/docs/00-summary-the-map.md
    about: One page covering what exists and what is confirmed vs unknown.
  - name: How to contribute
    url: https://github.com/NovaLux12/carelink-api-research/blob/main/AGENTS.md
    about: Evidence classes, the never-publish rules, and the traps.
  - name: Pick up a research area
    url: https://github.com/NovaLux12/carelink-api-research/blob/main/docs/11-suggested-research-areas.md
    # 4, computed, not inherited. S closed by this same branch; the remaining open
    # letters are F R K L. The counting rule is scripts/research-checks.py:224-227,
    # which counts ^### [A-Z]. headings and ^\| [A-Z] — closed rows — so the S6 row is
    # excluded by the pattern, and N+M stays 26. Re-derive rather than trust: run
    # python3 scripts/research-checks.py, which reads this sentence.
    about: 4 open areas, each with a stated blocker and a definition of done.
  - name: Bridge bug? File it on carelink-bridge instead
    url: https://github.com/NovaLux12/carelink-bridge/issues/new?template=bug.yml
    about: Login, upload, or crash failures in a client belong in the client repo. This repo takes observations about Medtronic's API, not client bugs.
  - name: Security exposure in a published vendor artefact
    url: https://github.com/NovaLux12/carelink-api-research/blob/main/SECURITY.md
    about: Redacted reporting for an exposed key, internal hostname, or auth gap. Never paste the value.
